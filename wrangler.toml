name = "hotpot"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
